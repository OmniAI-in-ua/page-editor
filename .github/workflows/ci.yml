name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Тести, типи й зібраний dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Залежності
        run: npm ci
      - name: Перевірка типів
        run: npm run typecheck
      - name: Тести
        run: npm test
      - name: dist відповідає коду
        run: |
          npm run build
          git diff --exit-code -- dist || (echo "dist/ застарів: запустіть npm run build і закомітьте dist/" && exit 1)
